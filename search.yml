search:
  keywords:
    - "Data Engineer"
    - "Senior Data Engineer"
    - "Analytics Engineer"
    - "Data Platform Engineer"
    - "dbt Developer"
    - "Snowflake Data Engineer"

  locations:
    - "Bengaluru"
    - "Remote"
    - "Noida"
    - "Delhi NCR"
    - "Hyderabad"

  experience_range:
    min: 2
    max: 6

  # Minimum salary you'd consider (in LPA)
  min_salary_lpa: 24

  # How many days back to look for jobs (1 = only yesterday's jobs)
  days_back: 1

portals:
  naukri:
    enabled: true
    max_results: 30
    base_url: "https://www.naukri.com"

  instahyre:
    enabled: true
    max_results: 20
    base_url: "https://www.instahyre.com"

  linkedin:
    enabled: true
    max_results: 20
    base_url: "https://www.linkedin.com/jobs"

  hirist:
    enabled: true
    max_results: 15
    base_url: "https://www.hirist.tech"

  foundit:
    enabled: false
    max_results: 15
    base_url: "https://www.foundit.in"

scoring:
  apply_threshold: 4.0
  consider_threshold: 3.0
  skip_threshold: 3.0

